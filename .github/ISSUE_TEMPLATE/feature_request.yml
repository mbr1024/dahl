name: Feature request
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！Dahl 是脚手架项目，我们优先采纳能提升「工程化实践」或「示例价值」的功能。
  - type: textarea
    id: problem
    attributes:
      label: 动机与背景
      description: 你希望在什么场景下解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你期望的形态是什么？可以是 API、页面、配置或示例
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他做法？
  - type: checkboxes
    id: scope
    attributes:
      label: 适用范围
      options:
        - label: 这是脚手架层面的通用能力（而非某个具体业务）
        - label: 我可以帮助实现（提交 PR）
