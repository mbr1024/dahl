# 依赖自动更新（https://docs.github.com/code-security/dependabot）
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
    # 刻意保持的版本（用户决定，暂不升级）：TS 5.8 / Vite 7 及配套插件
    ignore:
      - dependency-name: "typescript"
      - dependency-name: "vite"
      - dependency-name: "@vitejs/plugin-react"
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
