name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies for Rust checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: Check version consistency
        run: pnpm run version:check
      - name: Check identity consistency
        run: pnpm run identity:check
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: npm dependencies audit
        run: pnpm audit
      - name: Unit tests with coverage
        run: pnpm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
          # public repo 免 token；未激活 Codecov 时上传失败不阻塞 CI
          fail_ci_if_error: false

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build debug binary
        run: pnpm run tauri build --debug --no-bundle
      - name: Run e2e tests (embedded WebDriver, headless via xvfb)
        run: xvfb-run pnpm run test:e2e:run

  # 日常 CI 只做 Linux 构建冒烟（快速反馈）；
  # 三平台完整打包在 release.yml（打 v* tag 时触发）执行
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@cargo-audit
      - name: Rust dependency audit
        working-directory: src-tauri
        run: cargo audit
      - run: pnpm install --frozen-lockfile
      - name: Build (Linux smoke)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 显式 --no-bundle：CI 只验证构建；完整打包由 release.yml 在打 tag 时执行
          args: --no-bundle
