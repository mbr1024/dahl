name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 正式签名密钥（见 docs/DEPLOYMENT.md）；未配置时跳过签名
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Dahl v__VERSION__"
          releaseBody: |
            ## Dahl v__VERSION__

            > 完整变更记录见 [CHANGELOG](https://github.com/mbr1024/dahl/blob/main/CHANGELOG.md)（由 changesets 自动维护）。

            ### 安装

            | 平台 | 安装包 |
            |------|--------|
            | macOS | `.dmg` / `.app.tar.gz` |
            | Windows | `-setup.exe` / `.msi` |
            | Linux | `.deb` / `.rpm` / `.AppImage` |

            所有产物附带 minisign 签名（`.sig` 文件），`latest.json` 供 updater 使用。
          releaseDraft: true
          prerelease: false
